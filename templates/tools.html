<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tools · Lend</title>
</head>
<body>
  <p><a href="/">Home</a></p>
  <h1>Tools</h1>
  {% if error %}<p>{{ error }}</p>{% endif %}
  <form method="post" action="/tools">
    <label>Name <input name="name" required></label>
    <label>Category <input name="category" required></label>
    <button type="submit">Add tool</button>
  </form>
  <table>
    <tr>
      <th>Name</th>
      <th>Category</th>
      <th>Status</th>
      <th></th>
    </tr>
    {% for tool in tools %}
    <tr>
      <td>{{ tool.name }}</td>
      <td>{{ tool.category }}</td>
      <td>{% if tool.retired %}Retired{% else %}Available{% endif %}</td>
      <td>
        {% if not tool.retired %}
        <form method="post" action="/tools/{{ tool.id }}/retire">
          <button type="submit">Retire</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
